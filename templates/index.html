<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Call App Dashboard</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background: #f4f6f8;
        }

        h1 {
            margin-bottom: 20px;
        }

        .top {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        button, a {
            padding: 12px 18px;
            border: none;
            border-radius: 6px;
            text-decoration: none;
            cursor: pointer;
            background: #222;
            color: white;
        }

        .table-box {
            background: white;
            padding: 15px;
            border-radius: 8px;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 12px;
            border-bottom: 1px solid #ddd;
            text-align: left;
        }

        th {
            background: #eee;
        }
    </style>
</head>

<body>

    <h1>📊 My Call App Dashboard</h1>

    <div class="top">
        <button onclick="location.reload()">🔄 Refresh</button>
        <a href="/export.csv">📥 Download CSV</a>
    </div>

    <div class="table-box">

        <table>
            <thead>
                <tr>
                    <th>📞 Number</th>
                    <th>📅 Date</th>
                    <th>🕐 Time</th>
                    <th>⏱️ Duration</th>
                    <th>📲 Call Type</th>
                </tr>
            </thead>

            <tbody>
                {% for call in calls %}
                <tr>
                    <td>{{ call["number"] }}</td>
                    <td>{{ call["date"] }}</td>
                    <td>{{ call["time"] }}</td>
                    <td>{{ call["duration"] }}</td>
                    <td>{{ call["call_type"] }}</td>
                </tr>
                {% else %}
                <tr>
                    <td colspan="5">
                        No call records yet.
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>

    </div>

</body>
</html>
